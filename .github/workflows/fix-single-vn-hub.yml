name: Fix single Vietnam hub
on:
  push:
    paths:
      - '.github/workflows/fix-single-vn-hub.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map to use one Vietnam hub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="a=spreadPoint(project(sm,i),used,i*2+1),b=spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          new="hub=project('VN',0),a=sm==='VN'?hub:spreadPoint(project(sm,i),used,i*2+1),b=dm==='VN'?hub:spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          assert s.count(old)==1, f'route point guard failed: {s.count(old)}'
          s=s.replace(old,new)
          old2="let live=routeFreshActive(e);addMotionSource(sm,a,o,i,live);addMotionDest(dm,b,o,i,live)"
          new2="let live=routeFreshActive(e);if(String(sm).toUpperCase()!=='VN')addMotionSource(sm,a,o,i,live);if(String(dm).toUpperCase()!=='VN')addMotionDest(dm,b,o,i,live)"
          assert s.count(old2)==1, f'route node guard failed: {s.count(old2)}'
          s=s.replace(old2,new2)
          old3="let obs=A(DATA,'observations').filter(x=>GEO[x.source_country]).sort((a,b)=>String(b.observed_at||'').localeCompare(String(a.observed_at||'')));"
          new3="let obs=A(DATA,'observations').filter(x=>GEO[x.source_country]&&String(x.source_country).toUpperCase()!=='VN').sort((a,b)=>String(b.observed_at||'').localeCompare(String(a.observed_at||'')));"
          assert s.count(old3)==1, f'scan VN guard failed: {s.count(old3)}'
          s=s.replace(old3,new3)
          p.write_text(s)
          PY
      - name: Validate JS syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m, 'script not found'
          Path('/tmp/radar.js').write_text(m.group(1))
          PY
          node --check /tmp/radar.js
      - name: Validate one-hub invariants
        run: |
          grep -q "sm==='VN'?hub" index.html
          grep -q "dm==='VN'?hub" index.html
          grep -q "String(sm).toUpperCase()!=='VN'" index.html
          grep -q "String(dm).toUpperCase()!=='VN'" index.html
          grep -q "VIETNAM HUB" index.html
      - name: Commit patch
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git commit -m "Use one Vietnam hub for all trade routes"
          git push