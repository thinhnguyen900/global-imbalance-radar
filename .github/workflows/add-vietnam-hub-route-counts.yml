name: Add Vietnam hub route counts
on:
  push:
    paths:
      - '.github/workflows/add-vietnam-hub-route-counts.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hub route summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[],countryPts={},marketCounts={},marketLive={};"
          new="let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[],countryPts={},marketCounts={},marketLive={},visibleImportRoutes=0,visibleExportRoutes=0;"
          if old not in s:
              raise SystemExit('guard failed: map state pattern not found')
          s=s.replace(old,new,1)
          old2="exec=profitConfirmed(o);if(!a||!b||(!LAYERS.money&&exec)||(!LAYERS.research&&!exec))return;let rid="
          new2="exec=profitConfirmed(o);if(!a||!b||(!LAYERS.money&&exec)||(!LAYERS.research&&!exec))return;if(l==='IMPORT_TO_VN')visibleImportRoutes++;else if(l==='EXPORT_FROM_VN')visibleExportRoutes++;let rid="
          if old2 not in s:
              raise SystemExit('guard failed: visible route gate pattern not found')
          s=s.replace(old2,new2,1)
          old3="hub.innerHTML='<div class=\"vnHubCore\">🇻🇳</div><div class=\"vnHubLabel\">VIETNAM HUB</div>';"
          new3="hub.innerHTML=`<div class=\"vnHubCore\">🇻🇳</div><div class=\"vnHubLabel\">VIETNAM HUB · ${visibleImportRoutes} IN · ${visibleExportRoutes} OUT</div>`;"
          if old3 not in s:
              raise SystemExit('guard failed: hub label pattern not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
      - name: JS syntax smoke test
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script block not found')
          Path('/tmp/radar.js').write_text(m.group(1))
          PY
          node --check /tmp/radar.js
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git commit -m "Summarize visible trade routes on single Vietnam hub"
          git push
