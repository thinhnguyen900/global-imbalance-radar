name: Research aging visibility
on:
  push:
    paths:
      - '.github/workflows/research-aging-visibility.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add stale research visibility
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker="function renderResearch(){"
          helper='''function researchAgeHours(o){let r=economics(o).r,t=new Date(r?.updated_at||r?.created_at||o.updated_at||o.created_at||0).getTime();return Number.isFinite(t)&&t>0?Math.max(0,(Date.now()-t)/36e5):null}function researchAgeHtml(o){let h=researchAgeHours(o);if(h==null)return '<span class="mini">—</span>';let stale=h>=24;return `<span class="statusTag ${stale?'block':'ok'}">${stale?'STALE ':''}${h<1?'&lt;1h':Math.floor(h)+'h'}</span>`}'''
          if helper not in s:
              if marker not in s:
                  raise SystemExit('guard failed: renderResearch marker missing')
              s=s.replace(marker,helper+marker,1)
          old_sort="function renderResearch(){let rows=A(DATA,'opportunities').filter(o=>vnActive(o)&&!profitConfirmed(o)).sort((a,b)=>economics(b).done-economics(a).done||N(score(b),-1)-N(score(a),-1));"
          new_sort="function renderResearch(){let rows=A(DATA,'opportunities').filter(o=>vnActive(o)&&!profitConfirmed(o)).sort((a,b)=>((researchAgeHours(b)>=24?1:0)-(researchAgeHours(a)>=24?1:0))||economics(b).done-economics(a).done||N(score(b),-1)-N(score(a),-1));"
          if old_sort in s:
              s=s.replace(old_sort,new_sort,1)
          elif new_sort not in s:
              raise SystemExit('guard failed: research sort pattern missing')
          old_head='<th>Progress</th><th>Price comparison</th><th>Priority</th>'
          new_head='<th>Progress</th><th>Age</th><th>Price comparison</th><th>Priority</th>'
          if old_head in s:
              s=s.replace(old_head,new_head,1)
          elif new_head not in s:
              raise SystemExit('guard failed: research header pattern missing')
          old_row='<td><div class="queueStatus">${stageHtml(o,e)}</div></td><td class="compareCol">${comparisonCellHtml(o,e)}</td>'
          new_row='<td><div class="queueStatus">${stageHtml(o,e)}</div></td><td>${researchAgeHtml(o)}</td><td class="compareCol">${comparisonCellHtml(o,e)}</td>'
          if old_row in s:
              s=s.replace(old_row,new_row,1)
          elif new_row not in s:
              raise SystemExit('guard failed: research row pattern missing')
          p.write_text(s)
      - name: Verify patch
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'function researchAgeHours(o)' in s
          assert 'researchAgeHours(b)>=24' in s
          assert '<th>Age</th>' in s
          assert '${researchAgeHtml(o)}' in s
          assert s.count('<th>Age</th>') == 1
          print('research aging patch verified')
      - name: Commit patch
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Surface stale Vietnam research aging"
          git push