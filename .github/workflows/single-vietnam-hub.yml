name: Single Vietnam hub
on:
  push:
    paths:
      - '.github/workflows/single-vietnam-hub.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""function renderMap(){let rad=$('#radar'),svg=$('#routeSvg');rad.classList.remove('focus');rad.querySelectorAll('.pin,.dest,.scanMark,.vnHub').forEach(x=>x.remove());svg.innerHTML='<defs><marker id=\"sellArrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#9fb1bd\"/></marker></defs>';let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[];rows.forEach((o,i)=>{let e=economics(o),sm=e.r?.source_market||e.s?.market,dm=e.r?.destination_market||e.d?.market||o.target_market,l=tradeLane(o,e),a=spreadPoint(project(sm,i),used,i*2+1),b=spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"""
          new="""function renderMap(){let rad=$('#radar'),svg=$('#routeSvg');rad.classList.remove('focus');rad.querySelectorAll('.pin,.dest,.scanMark,.vnHub').forEach(x=>x.remove());svg.innerHTML='<defs><marker id=\"sellArrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#9fb1bd\"/></marker></defs>';let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[],hubPoint=project('VN',0);rows.forEach((o,i)=>{let e=economics(o),sm=e.r?.source_market||e.s?.market,dm=e.r?.destination_market||e.d?.market||o.target_market,l=tradeLane(o,e),a=String(sm).toUpperCase()==='VN'?hubPoint:spreadPoint(project(sm,i),used,i*2+1),b=String(dm).toUpperCase()==='VN'?hubPoint:spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"""
          if old not in s:
              raise SystemExit('guard failed: renderMap prefix changed')
          s=s.replace(old,new,1)
          old2="""let live=routeFreshActive(e);addMotionSource(sm,a,o,i,live);addMotionDest(dm,b,o,i,live)});let hp=project('VN',0);if(hp){let hub=document.createElement('div');hub.className='vnHub';hub.style.left=hp.x+'%';hub.style.top=hp.y+'%';hub.innerHTML='<div class=\"vnHubCore\">🇻🇳</div><div class=\"vnHubLabel\">VIETNAM HUB</div>';rad.appendChild(hub)}"""
          new2="""let live=routeFreshActive(e);if(String(sm).toUpperCase()!=='VN')addMotionSource(sm,a,o,i,live);if(String(dm).toUpperCase()!=='VN')addMotionDest(dm,b,o,i,live)});let hp=hubPoint;if(hp){let hub=document.createElement('div');hub.className='vnHub';hub.style.left=hp.x+'%';hub.style.top=hp.y+'%';hub.innerHTML='<div class=\"vnHubCore\">🇻🇳</div><div class=\"vnHubLabel\">VIETNAM HUB</div>';rad.appendChild(hub)}"""
          if old2 not in s:
              raise SystemExit('guard failed: source/dest node block changed')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Verify single hub invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "hubPoint=project('VN',0)" in s
          assert "if(String(sm).toUpperCase()!=='VN')addMotionSource" in s
          assert "if(String(dm).toUpperCase()!=='VN')addMotionDest" in s
          assert s.count('VIETNAM HUB') == 1
          print('single Vietnam hub checks passed')
          PY
      - name: Commit patch
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Collapse Vietnam map routes into one hub'
          git push
