name: Single Vietnam Hub
on:
  push:
    paths:
      - '.github/workflows/single-vietnam-hub.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map to one Vietnam hub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old1="let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[];rows.forEach((o,i)=>{let e=economics(o),sm=e.r?.source_market||e.s?.market,dm=e.r?.destination_market||e.d?.market||o.target_market,l=tradeLane(o,e),a=spreadPoint(project(sm,i),used,i*2+1),b=spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          new1="let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[],vnPoint=project('VN',0);rows.forEach((o,i)=>{let e=economics(o),sm=e.r?.source_market||e.s?.market,dm=e.r?.destination_market||e.d?.market||o.target_market,l=tradeLane(o,e),a=String(sm).toUpperCase()==='VN'?vnPoint:spreadPoint(project(sm,i),used,i*2+1),b=String(dm).toUpperCase()==='VN'?vnPoint:spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          old2="let live=routeFreshActive(e);addMotionSource(sm,a,o,i,live);addMotionDest(dm,b,o,i,live)});let hp=project('VN',0);if(hp){let hub=document.createElement('div');hub.className='vnHub';hub.style.left=hp.x+'%';hub.style.top=hp.y+'%';"
          new2="let live=routeFreshActive(e);if(String(sm).toUpperCase()!=='VN')addMotionSource(sm,a,o,i,live);if(String(dm).toUpperCase()!=='VN')addMotionDest(dm,b,o,i,live)});let hp=vnPoint;if(hp){let hub=document.createElement('div');hub.className='vnHub';hub.style.left=hp.x+'%';hub.style.top=hp.y+'%';"
          if s.count(old1)!=1:
              raise SystemExit(f'guard old1 count={s.count(old1)}')
          if s.count(old2)!=1:
              raise SystemExit(f'guard old2 count={s.count(old2)}')
          s=s.replace(old1,new1).replace(old2,new2)
          p.write_text(s)
          PY
      - name: Validate patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "String(sm).toUpperCase()==='VN'?vnPoint" in s
          assert "String(dm).toUpperCase()==='VN'?vnPoint" in s
          assert "if(String(sm).toUpperCase()!=='VN')addMotionSource" in s
          assert "if(String(dm).toUpperCase()!=='VN')addMotionDest" in s
          assert "let hp=vnPoint" in s
          print('single-VN-hub guards passed')
          PY
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script>([\s\S]*)<\/script>/);if(!m)throw Error('script not found');new Function(m[1]);console.log('JS syntax OK')"
      - name: Commit bounded UI change
        run: |
          git config user.name 'radar-builder'
          git config user.email 'radar-builder@users.noreply.github.com'
          git add index.html
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Converge Vietnam trade routes on one map hub'
          git push
