name: Single Vietnam hub map
on:
  push:
    paths:
      - '.github/workflows/single-vietnam-hub.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          original=s
          targets=[
            "a=String(sm||'').toUpperCase()==='VN'?project('VN',0):spreadPoint(project(sm,i),used,i*2+1)",
            "b=String(dm||'').toUpperCase()==='VN'?project('VN',0):spreadPoint(project(dm,i+4),used,i*2+2)",
            "if(String(sm||'').toUpperCase()!=='VN')addMotionSource(sm,a,o,i,live)",
            "if(String(dm||'').toUpperCase()!=='VN')addMotionDest(dm,b,o,i,live)",
            "filter(x=>GEO[x.source_country]&&String(x.source_country).toUpperCase()!=='VN')"
          ]
          replacements=[
            ("a=spreadPoint(project(sm,i),used,i*2+1)", targets[0]),
            ("b=spreadPoint(project(dm,i+4),used,i*2+2)", targets[1]),
            ("addMotionSource(sm,a,o,i,live);", targets[2]+";"),
            ("addMotionDest(dm,b,o,i,live)", targets[3]),
            ("filter(x=>GEO[x.source_country])", targets[4]),
          ]
          for old,new in replacements:
            if new in s:
              continue
            n=s.count(old)
            if n!=1:
              raise SystemExit(f'guard failed: target absent and expected 1 old occurrence, found {n}: {old}')
            s=s.replace(old,new,1)
          for t in targets:
            if t not in s:
              raise SystemExit('target invariant missing: '+t)
          if s!=original:
            p.write_text(s)
            Path('/tmp/changed').write_text('1')
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m, 'script block missing'
          Path('/tmp/radar.js').write_text(m.group(1))
          PY
          node --check /tmp/radar.js
      - name: Commit patch if needed
        run: |
          if [ -f /tmp/changed ]; then
            git config user.name radar-builder
            git config user.email radar-builder@users.noreply.github.com
            git add index.html
            git commit -m "Restore one shared Vietnam hub on trade map"
            git push
          else
            echo "Single Vietnam hub already present; no app change needed."
          fi