name: Single Vietnam Hub
on:
  push:
    paths:
      - '.github/workflows/single-vietnam-hub.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch map to use one Vietnam hub
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="a=spreadPoint(project(sm,i),used,i*2+1),b=spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          new="hubPoint=project('VN',0),a=String(sm).toUpperCase()==='VN'?hubPoint:spreadPoint(project(sm,i),used,i*2+1),b=String(dm).toUpperCase()==='VN'?hubPoint:spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          if old not in s:
              raise SystemExit('guard failed: route point pattern not found')
          s=s.replace(old,new,1)
          old2="let live=routeFreshActive(e);addMotionSource(sm,a,o,i,live);addMotionDest(dm,b,o,i,live)"
          new2="let live=routeFreshActive(e);if(String(sm).toUpperCase()!=='VN')addMotionSource(sm,a,o,i,live);if(String(dm).toUpperCase()!=='VN')addMotionDest(dm,b,o,i,live)"
          if old2 not in s:
              raise SystemExit('guard failed: endpoint render pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Syntax smoke check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "String(sm).toUpperCase()!=='VN'" in s
          assert "String(dm).toUpperCase()!=='VN'" in s
          assert "hubPoint=project('VN',0)" in s
          print('single VN hub guards present')
          PY
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/radar.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/radar.js
      - name: Commit patch
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git commit -m "Render routes through one Vietnam hub" || exit 0
          git push
