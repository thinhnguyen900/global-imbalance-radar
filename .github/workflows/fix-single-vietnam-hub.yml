name: Fix single Vietnam hub
on:
  push:
    paths:
      - '.github/workflows/fix-single-vietnam-hub.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old1="let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[];rows.forEach((o,i)=>{let e=economics(o),sm=e.r?.source_market||e.s?.market,dm=e.r?.destination_market||e.d?.market||o.target_market,l=tradeLane(o,e),a=spreadPoint(project(sm,i),used,i*2+1),b=spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          new1="let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[],hubPoint=project('VN',0);rows.forEach((o,i)=>{let e=economics(o),sm=e.r?.source_market||e.s?.market,dm=e.r?.destination_market||e.d?.market||o.target_market,l=tradeLane(o,e),a=sm==='VN'?hubPoint:spreadPoint(project(sm,i),used,i*2+1),b=dm==='VN'?hubPoint:spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          old2="let live=routeFreshActive(e);addMotionSource(sm,a,o,i,live);addMotionDest(dm,b,o,i,live)});let hp=project('VN',0);"
          new2="let live=routeFreshActive(e);if(sm!=='VN')addMotionSource(sm,a,o,i,live);if(dm!=='VN')addMotionDest(dm,b,o,i,live)});let hp=hubPoint;"
          assert old1 in s, 'renderMap route-point guard not found'
          assert old2 in s, 'renderMap VN-node guard not found'
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          assert "a=sm==='VN'?hubPoint" in s
          assert "if(sm!=='VN')addMotionSource" in s
          assert "if(dm!=='VN')addMotionDest" in s
          p.write_text(s)
          PY
      - name: JS syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          assert scripts
          Path('/tmp/radar.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/radar.js
      - name: Commit patch
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Collapse Vietnam routes to one map hub"
          git push
