name: Fix single Vietnam hub
on:
  push:
    paths:
      - '.github/workflows/fix-single-vietnam-hub.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Vietnam hub map behavior
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[];rows.forEach((o,i)=>{let e=economics(o),sm=e.r?.source_market||e.s?.market,dm=e.r?.destination_market||e.d?.market||o.target_market,l=tradeLane(o,e),a=spreadPoint(project(sm,i),used,i*2+1),b=spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          new="let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[],hubPt=project('VN',0);rows.forEach((o,i)=>{let e=economics(o),sm=String(e.r?.source_market||e.s?.market||'').toUpperCase(),dm=String(e.r?.destination_market||e.d?.market||o.target_market||'').toUpperCase(),l=tradeLane(o,e),a=sm==='VN'?hubPt:spreadPoint(project(sm,i),used,i*2+1),b=dm==='VN'?hubPt:spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          if old not in s:
              raise SystemExit('Guard failed: renderMap route positioning signature changed')
          s=s.replace(old,new,1)
          old2="let live=routeFreshActive(e);addMotionSource(sm,a,o,i,live);addMotionDest(dm,b,o,i,live)});let hp=project('VN',0);if(hp){"
          new2="let live=routeFreshActive(e);if(sm!=='VN')addMotionSource(sm,a,o,i,live);if(dm!=='VN')addMotionDest(dm,b,o,i,live)});let hp=hubPt;if(hp){"
          if old2 not in s:
              raise SystemExit('Guard failed: map node signature changed')
          s=s.replace(old2,new2,1)
          old3="let obs=A(DATA,'observations').filter(x=>GEO[x.source_country]).sort((a,b)=>String(b.observed_at||'').localeCompare(String(a.observed_at||'')));"
          new3="let obs=A(DATA,'observations').filter(x=>GEO[x.source_country]&&String(x.source_country||'').toUpperCase()!=='VN').sort((a,b)=>String(b.observed_at||'').localeCompare(String(a.observed_at||'')));"
          if old3 not in s:
              raise SystemExit('Guard failed: scan marker signature changed')
          s=s.replace(old3,new3,1)
          p.write_text(s)
      - name: Validate patch
        shell: bash
        run: |
          grep -q "hubPt=project('VN',0)" index.html
          grep -q "if(sm!=='VN')addMotionSource" index.html
          grep -q "if(dm!=='VN')addMotionDest" index.html
          grep -q "toUpperCase()!=='VN'" index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git commit -m "Use one fixed Vietnam hub on trade map"
          git push