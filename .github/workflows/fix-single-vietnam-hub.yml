name: Guard Vietnam regional map split
on:
  push:
    paths:
      - '.github/workflows/fix-single-vietnam-hub.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded map-density patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="],splitVN=regions.length>=2;function countryPoint(code,seed)"
          new="],taggedVnRoutes=rows.filter(o=>{let e=economics(o),sm=String(e.r?.source_market||e.s?.market||'').toUpperCase(),dm=String(e.r?.destination_market||e.d?.market||o.target_market||'').toUpperCase();return sm==='VN'?!!vnRegion(o,e,'source'):dm==='VN'?!!vnRegion(o,e,'destination'):false}).length,splitVN=rows.length>=8&&regions.length===3&&taggedVnRoutes===rows.length;function countryPoint(code,seed)"
          if s.count(old)!=1: raise SystemExit(f'split guard not found: {s.count(old)}')
          s=s.replace(old,new,1)
          assert "rows.length>=8&&regions.length===3&&taggedVnRoutes===rows.length" in s
          assert "VIETNAM HUB" in s
          assert "animateMotion" in s
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          assert scripts
          Path('/tmp/radar.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/radar.js
      - name: Commit and clean temporary workflow
        run: |
          rm .github/workflows/fix-single-vietnam-hub.yml
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html .github/workflows/fix-single-vietnam-hub.yml
          git commit -m "Guard Vietnam regional split by route density"
          git push
