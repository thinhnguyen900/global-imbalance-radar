name: Add lane blocker summary
on:
  push:
    paths:
      - '.github/workflows/add-lane-blocker-summary.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch lane cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="pc=rows.filter(profitConfirmed).length,research=rows.length-pc,best=rows[0],e=best?economics(best):null,st=best?conciseStatus(best,e):['NO ACTIVE CANDIDATE',''];return"
          new="pc=rows.filter(profitConfirmed).length,research=rows.length-pc,best=rows[0],e=best?economics(best):null,st=best?conciseStatus(best,e):['NO ACTIVE CANDIDATE',''],blocker=(()=>{let c={};rows.filter(o=>!profitConfirmed(o)).forEach(o=>{let k=conciseStatus(o,economics(o))[0];c[k]=(c[k]||0)+1});let top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return top?top[0]+' · '+top[1]+' candidate'+(top[1]>1?'s':''):'None'})();return"
          if s.count(old)!=1:
              raise SystemExit(f'guard failed: renderLanes anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old2="</div></div>`}$('#laneGrid').innerHTML=card('IMPORT_TO_VN'"
          new2="</div><div class=\"mini\" style=\"margin-top:7px\"><b>BIGGEST BLOCKER:</b> ${E(blocker)}</div></div>`}$('#laneGrid').innerHTML=card('IMPORT_TO_VN'"
          if s.count(old2)!=1:
              raise SystemExit(f'guard failed: lane card tail count={s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/radar.js').write_text(js)
          assert "BIGGEST BLOCKER:" in s
          assert "String(sm||'').toUpperCase()==='VN'?project('VN',0)" in s
          assert "if(String(sm||'').toUpperCase()!=='VN')addMotionSource" in s
          assert "if(String(dm||'').toUpperCase()!=='VN')addMotionDest" in s
          PY
          node --check /tmp/radar.js
      - name: Commit patch
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git commit -m "Surface dominant blocker in Vietnam lane cards"
          git push
