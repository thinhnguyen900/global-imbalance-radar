name: Research queue benchmark emphasis
on:
  push:
    paths:
      - '.github/workflows/restore-ui-motion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch research queue hierarchy
        shell: bash
        run: |
          cat > /tmp/patch_queue.py <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          css_old='.benchmarkCell{white-space:nowrap}'
          css_new='.benchmarkCell{white-space:nowrap}.benchmarkBox{display:inline-block;min-width:170px;padding:7px 9px;border:1px solid rgba(255,211,109,.30);border-radius:9px;background:rgba(255,211,109,.055)}.benchmarkStrong{font-size:16px;font-weight:800;color:#ffe39a;line-height:1.2}.benchmarkUsd{font-size:11px;color:#c9d7e0;margin-top:2px}.benchmarkMeta{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.25}.research .stateCol{width:150px;max-width:150px;white-space:nowrap}.research .economicsCol{min-width:150px}.research .benchmarkCol{min-width:210px}.research .tbl td{vertical-align:middle}'
          if css_old in s and '.benchmarkStrong{' not in s:
              s=s.replace(css_old,css_new,1)

          helper="""function marketBenchmarkFor(o,e){let market=String(e.r?.destination_market||e.d?.market||o.target_market||''),rows=A(DATA,'market_price_benchmarks').filter(b=>(String(b.opportunity_id||'')===String(o.id)||String(b.product_key||'')===String(o.product_key||''))&&(!market||String(b.market_code||'')===market));return rows.sort((a,b)=>String(b.updated_at||b.created_at||'').localeCompare(String(a.updated_at||a.created_at||'')))[0]||null}function benchmarkCellHtml(o,e){let b=marketBenchmarkFor(o,e),p=b?.competitive_sell_price??e.d?.price,c=b?.currency||e.d?.currency||'';if(p==null)return '<div class=\"benchmarkBox\"><div class=\"benchmarkStrong\">Pending</div><div class=\"benchmarkMeta\">competitive market benchmark not complete</div></div>';let u=usdLine(p,c),metaText=b?`${N(b.independent_seller_count)} independent sellers · ${E(b.benchmark_method||'competitive benchmark')}${b.benchmark_quality_score!=null?' · quality '+N(b.benchmark_quality_score):''}`:'provisional destination price · benchmark audit pending';return `<div class=\"benchmarkBox\"><div class=\"benchmarkStrong\">${N(p).toLocaleString()} ${E(c||'')}</div><div class=\"benchmarkUsd\">${E(u)}</div><div class=\"benchmarkMeta\">${metaText}</div></div>`}"
          anchor='function renderResearch(){'
          if 'function marketBenchmarkFor(o,e)' not in s and anchor in s:
              s=s.replace(anchor,helper+anchor,1)

          start=s.find('function renderResearch(){')
          end=s.find('function renderArchive(){',start)
          if start==-1 or end==-1:
              raise SystemExit('renderResearch markers not found')
          new_render='''function renderResearch(){let rows=A(DATA,'opportunities').filter(o=>active(o)&&!economics(o).exec).sort((a,b)=>economics(b).done-economics(a).done);$('#researchList').innerHTML=rows.length?`<table class="tbl"><thead><tr><th>Candidate</th><th>Route</th><th>Progress</th><th>Competitive benchmark</th><th>Landed / margin</th><th>State</th><th>Priority</th></tr></thead><tbody>${rows.map(o=>{let e=economics(o),r=e.r,land=r?.landed_cost??o.landed_cost_estimate,margin=r?.expected_margin_pct??o.expected_margin_pct,st=conciseStatus(o,e);return`<tr class="click" onclick="openOpp('${E(o.id)}')"><td><b>${icon(o.title)} ${E(o.title)}</b>${focusTrace(o)?' <span class="badge focusBadge">FOCUS</span>':''}<div class="mini">confidence ${o.confidence==null?'—':N(o.confidence)+'%'}</div></td><td>${E(r?.source_market||e.s?.market||'—')} → ${E(r?.destination_market||e.d?.market||o.target_market||'—')}</td><td><div class="queueStatus">${stageHtml(o,e)}</div></td><td class="benchmarkCol">${benchmarkCellHtml(o,e)}</td><td class="economicsCol">${land!=null?moneyLocalUsd(land,landedCurrency(o,r)):'<span class="statusText">Pending</span>'}<div class="mini">margin ${margin!=null?N(margin)+'%':'pending'}</div></td><td class="stateCol"><span class="statusTag ${st[1]}">${st[0]}</span></td><td class="score">${score(o)??'—'}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No active research candidate.</div>'}'''
          s=s[:start]+new_render+s[end:]
          p.write_text(s)
          PY
          python /tmp/patch_queue.py
      - name: Verify decision hierarchy and preserved invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Competitive benchmark</th>' index.html
          grep -q 'function marketBenchmarkFor' index.html
          grep -q 'market_price_benchmarks' index.html
          grep -q 'benchmarkStrong' index.html
          grep -q 'class="stateCol"' index.html
          ! grep -q '<th>Status</th>' index.html
          grep -q 'animateMotion' index.html
          grep -q 'sellArrow' index.html
          grep -q 'activeGatePulse' index.html
          grep -q 'Focus Results' index.html
          grep -q 'Hunt / Quote' index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Radar UI Restorer'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Emphasize competitive benchmark and compact research state'
          git push
