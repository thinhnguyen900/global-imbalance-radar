name: Restore approved UI motion
on:
  push:
    paths:
      - '.github/workflows/restore-ui-motion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize money comparisons
        shell: bash
        run: |
          cat > /tmp/patch_currency.py <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="const API='https://pixiaznazjmofxufgpru.supabase.co/functions/v1/radar-control-center?action=data';const $=s=>document.querySelector(s)"
          new="const API='https://pixiaznazjmofxufgpru.supabase.co/functions/v1/radar-control-center?action=data';const FX_API='https://open.er-api.com/v6/latest/USD';let FX={rates:{USD:1},updated:null,lastFetch:0};async function loadFX(){if(Date.now()-FX.lastFetch<1800000&&Object.keys(FX.rates).length>1)return;FX.lastFetch=Date.now();try{let c=new AbortController(),t=setTimeout(()=>c.abort(),4500),r=await fetch(FX_API,{cache:'no-store',signal:c.signal});clearTimeout(t);if(!r.ok)throw Error('FX '+r.status);let j=await r.json();if(j&&j.rates){FX.rates=j.rates;FX.updated=j.time_last_update_utc||new Date().toISOString()}}catch(e){}}function toUsd(amount,currency){let n=Number(amount),c=String(currency||'').toUpperCase();if(!Number.isFinite(n)||n<=0||!c)return null;if(c==='USD')return n;let rate=Number(FX.rates?.[c]);return Number.isFinite(rate)&&rate>0?n/rate:null}function usdLine(amount,currency){let u=toUsd(amount,currency);return u==null?'USD unavailable':`≈ US$${u.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`}function moneyLocalUsd(amount,currency){if(amount==null||!Number.isFinite(Number(amount)))return 'Pending';let c=String(currency||'').toUpperCase();let local=Number(amount).toLocaleString()+(c?' '+c:'');let usd=usdLine(amount,c);return `<span class=\"statusText\">${local}</span><div class=\"mini\">${usd}</div>`}const $=s=>document.querySelector(s)"
          if old in s and 'function moneyLocalUsd' not in s:
              s=s.replace(old,new,1)

          old_research="<td><span class=\"statusText\">sell ${bench}</span><div class=\"mini\">landed ${land!=null?N(land).toLocaleString()+' '+E(r?.landed_currency||''):'pending'} · margin ${margin!=null?N(margin)+'%':'pending'}</div></td>"
          new_research="<td><span class=\"mini\">sell</span>${e.d?.price?moneyLocalUsd(e.d.price,e.d.currency):'<span class=\"statusText\">Pending</span>'}<div class=\"mini\" style=\"margin-top:5px\">landed</div>${land!=null?moneyLocalUsd(land,r?.landed_currency||''):'<span class=\"statusText\">Pending</span>'}<div class=\"mini\">margin ${margin!=null?N(margin)+'%':'pending'}</div></td>"
          if old_research in s:
              s=s.replace(old_research,new_research,1)

          old_focus="<td>${land!=null?N(land).toLocaleString()+' '+E(r?.landed_currency||''):'Pending'}<div class=\"mini\">margin ${margin!=null?N(margin)+'%':'pending'}</div></td>"
          new_focus="<td>${land!=null?moneyLocalUsd(land,r?.landed_currency||''):'Pending'}<div class=\"mini\">margin ${margin!=null?N(margin)+'%':'pending'}</div></td>"
          if old_focus in s:
              s=s.replace(old_focus,new_focus,1)

          old_src="<div class=\"price\">${r?.source_price!=null?N(r.source_price).toLocaleString()+' '+E(r.source_currency||''):src?.price?N(src.price).toLocaleString()+' '+E(src.currency||''):'Pending'}</div>"
          new_src="<div class=\"price\">${r?.source_price!=null?N(r.source_price).toLocaleString()+' '+E(r.source_currency||''):src?.price?N(src.price).toLocaleString()+' '+E(src.currency||''):'Pending'}</div>${r?.source_price!=null?`<div class=\"mini\">${E(usdLine(r.source_price,r.source_currency||''))}</div>`:src?.price?`<div class=\"mini\">${E(usdLine(src.price,src.currency||''))}</div>`:''}"
          if old_src in s:
              s=s.replace(old_src,new_src,1)

          old_dst="<div class=\"price\">${r?.destination_price!=null?N(r.destination_price).toLocaleString()+' '+E(r.destination_currency||''):dst?.price?N(dst.price).toLocaleString()+' '+E(dst.currency||''):'Pending'}</div>"
          new_dst="<div class=\"price\">${r?.destination_price!=null?N(r.destination_price).toLocaleString()+' '+E(r.destination_currency||''):dst?.price?N(dst.price).toLocaleString()+' '+E(dst.currency||''):'Pending'}</div>${r?.destination_price!=null?`<div class=\"mini\">${E(usdLine(r.destination_price,r.destination_currency||''))}</div>`:dst?.price?`<div class=\"mini\">${E(usdLine(dst.price,dst.currency||''))}</div>`:''}"
          if old_dst in s:
              s=s.replace(old_dst,new_dst,1)

          old_load="async function load(){try{let r=await fetch(API+'&_='+Date.now(),{cache:'no-store'});"
          new_load="async function load(){try{await loadFX();let r=await fetch(API+'&_='+Date.now(),{cache:'no-store'});"
          if old_load in s:
              s=s.replace(old_load,new_load,1)

          # Remove unused benchmark string construction if present; harmless but avoids confusion.
          s=s.replace(",bench=e.d?.price?N(e.d.price).toLocaleString()+' '+E(e.d.currency||''):'Pending'","")

          p.write_text(s)
          PY
          python /tmp/patch_currency.py
      - name: Verify currency + preserved UI invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function moneyLocalUsd' index.html
          grep -q 'function usdLine' index.html
          grep -q 'await loadFX()' index.html
          grep -q 'animateMotion' index.html
          grep -q 'sellArrow' index.html
          grep -q 'activeGatePulse' index.html
          grep -q 'Focus Results' index.html
          grep -q 'Hunt / Quote' index.html
          ! grep -q '<th>Engine next action</th>' index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Radar UI Restorer'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Normalize cross-market currency comparisons'
          git push
