name: Vietnam hub dashboard redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vietnam-hub-redesign.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard around Vietnam trade lanes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          assert 'Global Imbalance Radar' in s
          assert 'function renderResearch()' in s
          assert 'animateMotion' in s and 'sellArrow' in s and 'activeGatePulse' in s

          s=s.replace('<title>Global Imbalance Radar</title>','<title>Vietnam Trade Radar</title>',1)
          s=s.replace('<div class="title">🌍 Global Imbalance Radar</div><div class="muted">Commerce Opportunity Engine · evidence → customer value → economics → action</div>','<div class="title">🇻🇳 Vietnam Trade Radar</div><div class="muted">Buy globally → sell in Vietnam · Source in Vietnam → sell globally</div>',1)
          s=s.replace('<a class="navbtn" href="focus.html">🎯 Focus Area</a>','<a class="navbtn" href="focus.html">⚙ Vietnam Scope</a>',1)

          css='''.laneGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.laneCard{background:rgba(11,21,30,.96);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:170px}.laneCard.import{border-color:#315d78;background:linear-gradient(145deg,rgba(38,104,139,.10),rgba(11,21,30,.96))}.laneCard.export{border-color:#2d6b55;background:linear-gradient(145deg,rgba(53,137,103,.09),rgba(11,21,30,.96))}.laneTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.laneName{font-size:18px;font-weight:850}.laneFlow{font-size:12px;color:var(--muted);margin-top:3px}.laneMetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.laneMetric{border:1px solid #203746;border-radius:9px;background:#09151e;padding:8px}.laneMetric b{display:block;font-size:18px;margin-top:2px}.laneCandidate{margin-top:10px;padding-top:9px;border-top:1px solid #1c303d}.laneTag{display:inline-block;border:1px solid #315d78;border-radius:999px;padding:3px 7px;font-size:9px;color:#9bd6ff}.laneTag.export{border-color:#2d6b55;color:#92e8c2}.profitGauge{font-size:34px;font-weight:900;line-height:1}.vnHub{position:absolute;transform:translate(-50%,-50%);z-index:12;pointer-events:none;text-align:center}.vnHubCore{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#d9272e;border:2px solid #ffd36d;box-shadow:0 0 0 7px rgba(217,39,46,.12),0 0 26px rgba(255,211,109,.45);animation:vnHubPulse 1.8s ease-in-out infinite}.vnHubLabel{font-size:10px;font-weight:850;color:#ffe6a5;text-shadow:0 1px 4px #000;margin-top:4px}.routePath.import{stroke:var(--blue)}.routePath.export{stroke:var(--green)}.routePath.exec{stroke:var(--gold);stroke-width:4;opacity:.98}@keyframes vnHubPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}'''
          marker='@media(max-width:1200px)'
          assert marker in s
          s=s.replace(marker,css+'@media(max-width:1200px)',1)
          s=s.replace('@media(max-width:1200px){.mapgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.decisionGrid{grid-template-columns:1fr}}','@media(max-width:1200px){.mapgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.decisionGrid{grid-template-columns:1fr}.laneGrid{grid-template-columns:1fr}}',1)

          s,n=re.subn(r'<section class="panel focusResults">.*?</section><section class="panel money">','<section id="laneGrid" class="laneGrid"></section><section class="panel money">',s,count=1,flags=re.S)
          assert n==1
          s=s.replace('<h2>💰 Money Opportunities</h2><div class="muted">Only executable economics appear here.</div>','<h2>💰 Profit-Confirmed Vietnam Trades</h2><div class="muted">Only Vietnam import/export routes that survive conservative economics appear here.</div>',1)
          s=s.replace('<h2>🔬 Autonomous Research Queue</h2><div class="muted">Compact decision view · internal engine actions stay in deep dive.</div>','<h2>🔬 Vietnam Trade Research Queue</h2><div class="muted">Only active IMPORT_TO_VN and EXPORT_FROM_VN research appears here.</div>',1)
          s=s.replace('<h2 style="margin:0">🛰 Global opportunity flow</h2><div class="muted">Global scan + focused findings share the system of record.</div>','<h2 style="margin:0">🇻🇳 Vietnam trade flow</h2><div class="muted">Vietnam is the hub · blue routes import to VN · green routes export from VN.</div>',1)
          s=s.replace('<h2>🗄 Rejected / checked history</h2><div class="muted">Rejected does not mean forgotten. Verified evidence remains inspectable.</div>','<h2>🗄 Rejected / legacy history</h2><div class="muted">Rejected Vietnam routes and legacy non-Vietnam research remain inspectable; nothing is hidden.</div>',1)

          needle="function active(o){return String(o.decision||'').toUpperCase()!=='REJECT'}function valueProp"
          helpers="""function active(o){return String(o.decision||'').toUpperCase()!=='REJECT'}function tradeLane(o,e){e=e||economics(o);let r=e.r,sm=String(r?.source_market||e.s?.market||'').toUpperCase(),dm=String(r?.destination_market||e.d?.market||o.target_market||'').toUpperCase(),tag=String(meta(r).trade_lane||meta(r).direction||'').toUpperCase();if(tag==='IMPORT_TO_VN'||tag==='EXPORT_FROM_VN')return tag;if(dm==='VN'&&sm&&sm!=='VN')return'IMPORT_TO_VN';if(sm==='VN'&&dm&&dm!=='VN')return'EXPORT_FROM_VN';return'OTHER'}function vnActive(o){return active(o)&&tradeLane(o)!=='OTHER'}function profitConfirmed(o){let e=economics(o),r=e.r;if(!vnActive(o))return false;let margin=r?.expected_margin_pct??o.expected_margin_pct,profit=r?.expected_profit??o.expected_profit,profitable=margin!=null?Number(margin)>0:(profit!=null&&Number(profit)>0),fs=String(r?.freight_status||o.estimates?.freight_status||'').toLowerCase(),ts=String(r?.tax_status||o.estimates?.tax_status||'').toLowerCase(),freightStrong=/(verified_quote|verified|complete)/.test(fs)&&!/(indicative|public_tariff|estimate|pending|checking)/.test(fs),taxStrong=/(verified|known|complete)/.test(ts)&&!/(indicative|estimate|pending|checking)/.test(ts);return e.buy&&e.sell&&e.landed&&profitable&&freightStrong&&taxStrong&&N(o.confidence,0)>=90}function laneText(l){return l==='IMPORT_TO_VN'?'IMPORT → VN':l==='EXPORT_FROM_VN'?'VN → EXPORT':'LEGACY'}function laneBadge(l){return l==='IMPORT_TO_VN'?'<span class=\"laneTag\">⬇ IMPORT → VN</span>':l==='EXPORT_FROM_VN'?'<span class=\"laneTag export\">⬆ VN → EXPORT</span>':'<span class=\"badge\">LEGACY</span>'}function valueProp"""
          assert needle in s
          s=s.replace(needle,helpers,1)

          new_focus="""function renderFocus(){let f=activeFocus(),b=$('#focusSummary');b.innerHTML=`<div class=\"focusMain\"><div class=\"focusIcon\">🇻🇳</div><div><div class=\"focusTitle\">Vietnam-first mode · 100% focus</div><div class=\"focusMeta\">Two permanent lanes: WORLD → VN and VN → WORLD · All categories · Profit-certainty target ≥80%</div></div></div><div class=\"focusLane\"><span class=\"laneDot\"></span><span>${f?E(f.name||'VN Focus'):'VN Focus'} · ${f?N(f.focus_share_pct):100}%</span></div>`}function setFocusView"""
          s,n=re.subn(r'function renderFocus\(\)\{.*?\}function setFocusView',new_focus,s,count=1,flags=re.S)
          assert n==1

          new_lanes="""function renderLanes(){let ops=A(DATA,'opportunities').filter(vnActive);function card(lane,title,flow,cls){let rows=ops.filter(o=>tradeLane(o)===lane).sort((a,b)=>(profitConfirmed(b)-profitConfirmed(a))||(economics(b).done-economics(a).done)||N(score(b),-1)-N(score(a),-1)),pc=rows.filter(profitConfirmed).length,research=rows.length-pc,best=rows[0],e=best?economics(best):null,st=best?conciseStatus(best,e):['NO ACTIVE CANDIDATE',''];return `<div class=\"laneCard ${cls}\"><div class=\"laneTop\"><div><div class=\"laneName\">${title}</div><div class=\"laneFlow\">${flow}</div></div>${laneBadge(lane)}</div><div class=\"laneMetrics\"><div class=\"laneMetric\"><span class=\"mini\">ACTIVE</span><b>${rows.length}</b></div><div class=\"laneMetric\"><span class=\"mini\">PROFIT CONFIRMED</span><b class=\"good\">${pc}</b></div><div class=\"laneMetric\"><span class=\"mini\">RESEARCH</span><b>${research}</b></div></div><div class=\"laneCandidate\">${best?`<div class=\"mini\">BEST CURRENT CANDIDATE</div><b class=\"click\" onclick=\"openOpp('${E(best.id)}')\">${icon(best.title)} ${E(best.title)}</b><div class=\"mini\">${e.done}/6 gates · ${E(st[0])} · confidence ${best.confidence==null?'—':N(best.confidence)+'%'}</div>`:'<div class=\"muted\">Scanner is looking for a viable candidate in this lane.</div>'}</div></div>`}$('#laneGrid').innerHTML=card('IMPORT_TO_VN','⬇ Import to Vietnam','WORLD → 🇻🇳 VN','import')+card('EXPORT_FROM_VN','⬆ Export from Vietnam','🇻🇳 VN → WORLD','export')}function renderStats"""
          s,n=re.subn(r'function renderFocusResults\(\)\{.*?\}function renderStats',new_lanes,s,count=1,flags=re.S)
          assert n==1

          new_stats="""function renderStats(){let ops=A(DATA,'opportunities'),vn=ops.filter(vnActive),pc=vn.filter(profitConfirmed),imp=vn.filter(o=>tradeLane(o)==='IMPORT_TO_VN'),exp=vn.filter(o=>tradeLane(o)==='EXPORT_FROM_VN'),archive=ops.filter(o=>!vnActive(o));$('#stats').innerHTML=[['Profit confirmed',pc.length],['Import → VN',imp.length],['VN → Export',exp.length],['Active research',vn.length-pc.length],['Rejected / legacy',archive.length],['Route attempts',A(DATA,'route_attempts').length]].map(x=>`<div class=\"card\"><div class=\"k\">${x[0]}</div><div class=\"v\">${x[1]}</div></div>`).join('')}function renderDecision"""
          s,n=re.subn(r'function renderStats\(\)\{.*?\}function renderDecision',new_stats,s,count=1,flags=re.S)
          assert n==1

          new_decision="""function renderDecision(){let ops=A(DATA,'opportunities').filter(vnActive),pick=lane=>ops.filter(o=>tradeLane(o)===lane).sort((a,b)=>(profitConfirmed(b)-profitConfirmed(a))||(economics(b).done-economics(a).done)||N(score(b),-1)-N(score(a),-1))[0],imp=pick('IMPORT_TO_VN'),exp=pick('EXPORT_FROM_VN'),pc=ops.filter(profitConfirmed).length,ratio=ops.length?pc/ops.length*100:0,c=(h,v,s)=>`<div class=\"heroCard\"><h3>${h}</h3><div class=\"heroValue\">${v}</div><div class=\"heroSub\">${s}</div></div>`;let desc=o=>o?`${economics(o).done}/6 gates · ${E(conciseStatus(o,economics(o))[0])}`:'No active candidate yet';$('#decisionGrid').innerHTML=c('Import → VN',imp?icon(imp.title)+' '+E(imp.title):'Searching globally',desc(imp))+c('VN → Export',exp?icon(exp.title)+' '+E(exp.title):'Searching foreign demand',desc(exp))+c('Profit-certainty ratio',`<span class=\"profitGauge ${ratio>=80?'good':ratio>0?'warn':'bad'}\">${ratio.toFixed(0)}%</span>`,`${pc}/${ops.length} active Vietnam opportunities are profit-confirmed · target ≥80%`)}function renderMoney"""
          s,n=re.subn(r'function renderDecision\(\)\{.*?\}function renderMoney',new_decision,s,count=1,flags=re.S)
          assert n==1

          new_money="""function renderMoney(){let rows=A(DATA,'opportunities').filter(profitConfirmed);$('#moneyList').innerHTML=rows.length?`<table class=\"tbl\"><thead><tr><th>Lane</th><th>Opportunity</th><th>Route</th><th>Net profit</th><th>Margin</th><th>Confidence</th></tr></thead><tbody>${rows.map(o=>{let e=economics(o),r=e.r,profit=r?.expected_profit??o.expected_profit,pc=profitCurrency(o,r),margin=r?.expected_margin_pct??o.expected_margin_pct,l=tradeLane(o,e);return`<tr class=\"click\" onclick=\"openOpp('${E(o.id)}')\"><td>${laneBadge(l)}</td><td><b>${icon(o.title)} ${E(o.title)}</b></td><td>${E(e.r?.source_market||e.s?.market||'—')} → ${E(e.r?.destination_market||e.d?.market||o.target_market||'—')}</td><td>${profit==null?'—':moneyLocalUsd(profit,pc)}</td><td>${margin==null?'—':N(margin)+'%'}</td><td>${N(o.confidence)}%</td></tr>`}).join('')}</tbody></table>`:'<div class=\"empty\"><b>No Vietnam trade is profit-confirmed yet.</b><br>Routes stay in Research until source, sell benchmark, freight, compliance, landed economics and conservative profit are all defensible.</div>'}function marketBenchmarkFor"""
          s,n=re.subn(r'function renderMoney\(\)\{.*?\}function marketBenchmarkFor',new_money,s,count=1,flags=re.S)
          assert n==1

          new_research="""function renderResearch(){let rows=A(DATA,'opportunities').filter(o=>vnActive(o)&&!profitConfirmed(o)).sort((a,b)=>economics(b).done-economics(a).done||N(score(b),-1)-N(score(a),-1));$('#researchList').innerHTML=rows.length?`<table class=\"tbl\"><thead><tr><th>Lane</th><th>Candidate</th><th>Route</th><th>Progress</th><th>Price comparison</th><th>Priority</th></tr></thead><tbody>${rows.map(o=>{let e=economics(o),l=tradeLane(o,e);return`<tr class=\"click\" onclick=\"openOpp('${E(o.id)}')\"><td>${laneBadge(l)}</td><td><b>${icon(o.title)} ${E(o.title)}</b><div class=\"mini\">confidence ${o.confidence==null?'—':N(o.confidence)+'%'}</div></td><td>${E(e.r?.source_market||e.s?.market||'—')} → ${E(e.r?.destination_market||e.d?.market||o.target_market||'—')}</td><td><div class=\"queueStatus\">${stageHtml(o,e)}</div></td><td class=\"compareCol\">${comparisonCellHtml(o,e)}</td><td class=\"score\">${score(o)??'—'}</td></tr>`}).join('')}</tbody></table>`:'<div class=\"empty\">No active Vietnam trade research candidate.</div>'}function renderArchive"""
          s,n=re.subn(r'function renderResearch\(\)\{.*?\}function renderArchive',new_research,s,count=1,flags=re.S)
          assert n==1

          new_archive="""function renderArchive(){let rows=A(DATA,'opportunities').filter(o=>!vnActive(o));$('#archiveList').innerHTML=rows.length?`<table class=\"tbl\"><thead><tr><th>Opportunity</th><th>Route</th><th>Archive reason</th></tr></thead><tbody>${rows.map(o=>{let e=economics(o),legacy=active(o)&&tradeLane(o,e)==='OTHER';return`<tr class=\"click\" onclick=\"openOpp('${E(o.id)}')\"><td><b>${icon(o.title)} ${E(o.title)}</b></td><td>${E(e.r?.source_market||e.s?.market||'—')} → ${E(e.r?.destination_market||o.target_market||'—')}</td><td>${legacy?'<span class=\"badge\">LEGACY · OUT OF VN SCOPE</span>':E(o.risk_summary||e.r?.stop_reason||'Rejected')}</td></tr>`}).join('')}</tbody></table>`:'<div class=\"empty\">No rejected or legacy history.</div>'}function project"""
          s,n=re.subn(r'function renderArchive\(\)\{.*?\}function project',new_archive,s,count=1,flags=re.S)
          assert n==1

          new_map="""function renderMap(){let rad=$('#radar'),svg=$('#routeSvg');rad.classList.remove('focus');rad.querySelectorAll('.pin,.dest,.scanMark,.vnHub').forEach(x=>x.remove());svg.innerHTML='<defs><marker id=\"sellArrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#9fb1bd\"/></marker></defs>';let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[];rows.forEach((o,i)=>{let e=economics(o),sm=e.r?.source_market||e.s?.market,dm=e.r?.destination_market||e.d?.market||o.target_market,l=tradeLane(o,e),a=spreadPoint(project(sm,i),used,i*2+1),b=spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);if(!a||!b||(!LAYERS.money&&exec)||(!LAYERS.research&&!exec))return;let rid='route-'+String(o.id).replace(/[^a-zA-Z0-9_-]/g,'-'),rp=document.createElementNS('http://www.w3.org/2000/svg','path');rp.setAttribute('id',rid);rp.setAttribute('d',curve(a,b));rp.setAttribute('class','routePath '+(l==='IMPORT_TO_VN'?'import':'export')+' '+(exec?'exec':''));rp.setAttribute('marker-end','url(#sellArrow)');rp.dataset.opp=o.id;svg.appendChild(rp);let cargo=document.createElementNS('http://www.w3.org/2000/svg','text');cargo.setAttribute('class','cargo');cargo.dataset.opp=o.id;cargo.textContent=icon(o.title);let motion=document.createElementNS('http://www.w3.org/2000/svg','animateMotion');motion.setAttribute('dur',(2.7+(i%5)*.35)+'s');motion.setAttribute('repeatCount','indefinite');motion.setAttribute('calcMode','linear');let mp=document.createElementNS('http://www.w3.org/2000/svg','mpath');mp.setAttribute('href','#'+rid);motion.appendChild(mp);cargo.appendChild(motion);svg.appendChild(cargo);let live=routeFreshActive(e);addMotionSource(sm,a,o,i,live);addMotionDest(dm,b,o,i,live)});let hp=project('VN',0);if(hp){let hub=document.createElement('div');hub.className='vnHub';hub.style.left=hp.x+'%';hub.style.top=hp.y+'%';hub.innerHTML='<div class=\"vnHubCore\">🇻🇳</div><div class=\"vnHubLabel\">VIETNAM HUB</div>';rad.appendChild(hub)}if(LAYERS.scan){let obs=A(DATA,'observations').filter(x=>GEO[x.source_country]).sort((a,b)=>String(b.observed_at||'').localeCompare(String(a.observed_at||'')));obs.slice(0,45).forEach((x,i)=>{let pt=project(x.source_country,i);if(!pt)return;let el=document.createElement('div'),fresh=Date.now()-new Date(x.observed_at||0).getTime()<2*60*1000;el.className='scanMark'+(fresh?' live':'');el.style.left=pt.x+'%';el.style.top=pt.y+'%';el.innerHTML=fresh?`<div class=\"scanLive\"></div><div class=\"scanTag\">LIVE · ${E(x.source_country)}</div>`:'<div class=\"scanDone\"></div>';rad.appendChild(el)})}}function toggleLayer"""
          s,n=re.subn(r'function renderMap\(\)\{.*?\}function toggleLayer',new_map,s,count=1,flags=re.S)
          assert n==1

          new_scan="""function renderScan(){let runs=A(DATA,'runs'),obs=A(DATA,'observations').sort((a,b)=>String(b.observed_at||'').localeCompare(String(a.observed_at||''))),ops=A(DATA,'opportunities').filter(vnActive),imp=ops.filter(o=>tradeLane(o)==='IMPORT_TO_VN').length,exp=ops.filter(o=>tradeLane(o)==='EXPORT_FROM_VN').length;$('#scanState').innerHTML=`<div class=\"sideRow\"><b>Vietnam corridor scanner</b><br><span class=\"good\">● 100% Vietnam-centered</span></div><div class=\"sideRow\"><b>Active lanes</b><br>Import → VN: ${imp} · VN → Export: ${exp}</div><div class=\"sideRow\"><b>Latest run</b><br>${E(runs[0]?.run_type||'—')} · ${E(runs[0]?.status||'—')}</div><div class=\"sideRow\"><b>Observed trail</b><br>${obs.length} touches</div>`;$('#ledger').innerHTML=obs.slice(0,28).map(x=>`<div class=\"scanLine\"><span>• done</span><span>${E(x.source_country||'')} · ${E(x.source_name||x.product_name||x.product_key||'')}</span><span class=\"mini\">${x.observed_at?new Date(x.observed_at).toLocaleTimeString():''}</span></div>`).join('')}function safe"""
          s,n=re.subn(r'function renderScan\(\)\{.*?\}function safe',new_scan,s,count=1,flags=re.S)
          assert n==1

          s=s.replace('renderFocus();renderStats();renderDecision();renderFocusResults();renderMoney();renderResearch();renderMap();renderScan();renderArchive()','renderFocus();renderStats();renderDecision();renderLanes();renderMoney();renderResearch();renderMap();renderScan();renderArchive()',1)

          assert '🇻🇳 Vietnam Trade Radar' in s
          assert 'function tradeLane' in s and 'function profitConfirmed' in s and 'function renderLanes' in s
          assert 'Focus Results' not in s
          assert 'Global opportunity flow' not in s
          assert 'animateMotion' in s and 'sellArrow' in s and 'activeGatePulse' in s and 'routeSourcePulse' in s
          p.write_text(s)
          PY
      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/radar.js').write_text(m.group(1))
          PY
          node --check /tmp/radar.js
      - name: Guard preserved UI and data hooks
        run: |
          grep -q 'Vietnam Trade Radar' index.html
          grep -q 'IMPORT → VN' index.html
          grep -q 'VN → EXPORT' index.html
          grep -q 'animateMotion' index.html
          grep -q 'activeGatePulse' index.html
          grep -q 'market_price_benchmarks' index.html
          grep -q 'Rejected / legacy history' index.html
          grep -q 'Hunt / Quote' index.html
      - name: Commit dashboard redesign
        run: |
          git config user.name 'radar-builder'
          git config user.email 'radar-builder@users.noreply.github.com'
          git add index.html
          git commit -m 'Redesign dashboard around Vietnam trade hub'
          git push
