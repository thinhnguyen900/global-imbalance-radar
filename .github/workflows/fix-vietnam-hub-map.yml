name: Fix Vietnam hub map
on:
  push:
    paths:
      - '.github/workflows/fix-vietnam-hub-map.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Vietnam hub rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="a=spreadPoint(project(sm,i),used,i*2+1),b=spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          new="a=(String(sm).toUpperCase()==='VN'?project('VN',0):spreadPoint(project(sm,i),used,i*2+1)),b=(String(dm).toUpperCase()==='VN'?project('VN',0):spreadPoint(project(dm,i+4),used,i*2+2)),exec=profitConfirmed(o);"
          if old not in s:
              raise SystemExit('guard failed: route endpoint pattern not found')
          s=s.replace(old,new,1)
          old2="let live=routeFreshActive(e);addMotionSource(sm,a,o,i,live);addMotionDest(dm,b,o,i,live)"
          new2="let live=routeFreshActive(e);if(String(sm).toUpperCase()!=='VN')addMotionSource(sm,a,o,i,live);if(String(dm).toUpperCase()!=='VN')addMotionDest(dm,b,o,i,live)"
          if old2 not in s:
              raise SystemExit('guard failed: endpoint marker pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: JS syntax smoke test
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script block not found')
          Path('/tmp/radar.js').write_text(m.group(1))
          PY
          node --check /tmp/radar.js
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git commit -m "Collapse Vietnam routes into single map hub"
          git push
