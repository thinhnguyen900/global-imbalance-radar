name: Align Profit Quality Status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/align-profit-quality-status.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align visible blockers with profit-confirmed quality gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          pat=r"function profitConfirmed\(o\)\{.*?\}function laneText"
          repl="""function profitQuality(o){let e=economics(o),r=e.r,fs=String(r?.freight_status||o.estimates?.freight_status||'').toLowerCase(),ts=String(r?.tax_status||o.estimates?.tax_status||'').toLowerCase(),benchmark=N(r?.benchmark_quality_score??o.benchmark_quality_score,0),sourceAccessText=String(meta(r).source_accessibility||r?.status||r?.stop_reason||'').toLowerCase(),sourceAccessible=!!safe(r?.source_url||e.s?.url)&&!/(inaccessible|not[_ -]?evidenced|internal[_ -]?transfer|customs[_ -]?value|reference[_ -]?only)/.test(sourceAccessText),freightStrong=/(verified_quote|verified|complete)/.test(fs)&&!/(indicative|public_tariff|estimate|pending|checking)/.test(fs),taxStrong=/(verified|known|complete)/.test(ts)&&!/(indicative|estimate|pending|checking)/.test(ts),benchmarkStrong=benchmark>=80,confidenceStrong=N(o.confidence,0)>=90;return{sourceAccessible,freightStrong,taxStrong,benchmarkStrong,confidenceStrong,benchmark}}function profitConfirmed(o){let e=economics(o),r=e.r;if(!vnActive(o))return false;let margin=r?.expected_margin_pct??o.expected_margin_pct,profit=r?.expected_profit??o.expected_profit,profitable=margin!=null?Number(margin)>0:(profit!=null&&Number(profit)>0),q=profitQuality(o);return e.buy&&e.sell&&e.landed&&profitable&&q.sourceAccessible&&q.freightStrong&&q.taxStrong&&q.benchmarkStrong&&q.confidenceStrong}function laneText"""
          s2,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'guard failed: profitConfirmed replacement count={n}')
          pat2=r"function conciseStatus\(o,e\)\{.*?\}function routePrice"
          repl2="""function conciseStatus(o,e){let q=profitQuality(o);if(!q.sourceAccessible)return['SOURCE ACCESS PENDING','check'];if(!q.benchmarkStrong)return[`BENCHMARK QUALITY ${q.benchmark}/80`,'check'];if(e.fs==='blocked')return['FREIGHT BLOCKED','block'];if(e.ts==='blocked')return['TAX / COMPLIANCE BLOCKED','block'];if(!e.sell)return['BENCHMARK PENDING','check'];if(e.fs==='checking')return['FREIGHT CHECK','check'];if(!e.freight)return['FREIGHT PENDING','check'];if(e.ts==='checking')return['TAX CHECK','check'];if(!e.compliance)return['TAX / COMPLIANCE PENDING','check'];if(!e.landed)return['LANDED COST PENDING','check'];if(!e.profit)return['MARGIN PENDING','check'];if(!q.confidenceStrong)return[`CONFIDENCE ${N(o.confidence,0)}/90`,'check'];return['READY FOR PROMOTION','ok']}function routePrice"""
          s3,n2=re.subn(pat2,repl2,s2,count=1,flags=re.S)
          if n2!=1: raise SystemExit(f'guard failed: conciseStatus replacement count={n2}')
          p.write_text(s3)
          PY
      - name: Test patch
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'function profitQuality(o)' in s
          assert 'SOURCE ACCESS PENDING' in s
          assert 'BENCHMARK QUALITY ${q.benchmark}/80' in s
          assert 'CONFIDENCE ${N(o.confidence,0)}/90' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/radar.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/radar.js
      - name: Commit and clean temporary workflows
        run: |
          rm -f .github/workflows/align-profit-quality-status.yml .github/workflows/single-vietnam-hub.yml
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add -A
          git commit -m "Align research blockers with profit quality gates"
          git push