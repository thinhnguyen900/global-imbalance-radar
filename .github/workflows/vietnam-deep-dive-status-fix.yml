name: Vietnam deep-dive status fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vietnam-deep-dive-status-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align deep dive with profit-confirmed gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="Status<b>${!active(o)?'🗄 REJECTED':e.exec?'💰 MONEY':'🔬 RESEARCH'}</b>"
          new="Status<b>${!active(o)?'🗄 REJECTED':profitConfirmed(o)?'💰 PROFIT CONFIRMED':'🔬 RESEARCH'}</b>"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          assert 'function profitConfirmed' in s
          assert 'animateMotion' in s and 'sellArrow' in s and 'activeGatePulse' in s
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(); m=re.search(r'<script>(.*)</script>',s,re.S); assert m
          Path('/tmp/radar.js').write_text(m.group(1))
          PY
          node --check /tmp/radar.js
      - name: Commit
        run: |
          git config user.name 'radar-builder'
          git config user.email 'radar-builder@users.noreply.github.com'
          git add index.html
          git commit -m 'Align deep dive with Vietnam profit-confirmed gate'
          git push
