name: Dedupe country map nodes
on:
  push:
    paths:
      - '.github/workflows/dedupe-country-map-nodes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Vietnam hub map endpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_css=".vnHubLabel{font-size:10px;font-weight:850;color:#ffe6a5;text-shadow:0 1px 4px #000;margin-top:4px}.routePath.import{stroke:var(--blue)}"
          new_css=".vnHubLabel{font-size:10px;font-weight:850;color:#ffe6a5;text-shadow:0 1px 4px #000;margin-top:4px}.marketNode{position:absolute;transform:translate(-50%,-50%);z-index:9;text-align:center;cursor:pointer}.marketNodeCore{min-width:28px;height:28px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:#08141d;border:2px solid #4b6879;font-size:10px;font-weight:850;box-shadow:0 0 12px rgba(124,200,255,.14)}.marketNode.live .marketNodeCore{border-color:var(--cyan);box-shadow:0 0 16px rgba(121,242,223,.32)}.marketNodeCount{font-size:9px;color:var(--muted);margin-top:2px}.marketNode.focused .marketNodeCore{transform:scale(1.15);border-color:var(--gold);box-shadow:0 0 20px rgba(255,211,109,.35)}.routePath.import{stroke:var(--blue)}"
          if old_css not in s: raise SystemExit('guard failed: css anchor not found')
          s=s.replace(old_css,new_css,1)
          old_focus="function bindFocus(el,id){el.dataset.opp=id;el.addEventListener('mouseenter',()=>focusOppMap(id,true));el.addEventListener('mouseleave',()=>focusOppMap(id,false))}"
          new_focus="function bindFocus(el,id){el.dataset.opp=id;el.addEventListener('mouseenter',()=>focusOppMap(id,true));el.addEventListener('mouseleave',()=>focusOppMap(id,false))}function focusMarketMap(code,on){let r=$('#radar'),c=String(code||'').toUpperCase();r.classList.toggle('focus',on);r.querySelectorAll('[data-markets]').forEach(el=>el.classList.toggle('focused',on&&String(el.dataset.markets||'').split(' ').includes(c)));r.querySelectorAll('.marketNode').forEach(el=>el.classList.toggle('focused',on&&String(el.dataset.market||'')===c))}function addMarketNode(code,p,count,live){let el=document.createElement('div');el.className='marketNode '+(live?'live':'');el.dataset.market=String(code||'').toUpperCase();el.style.left=p.x+'%';el.style.top=p.y+'%';el.addEventListener('mouseenter',()=>focusMarketMap(code,true));el.addEventListener('mouseleave',()=>focusMarketMap(code,false));el.innerHTML=`<div class=\"marketNodeCore\">${E(code)}</div><div class=\"marketNodeCount\">${count} route${count===1?'':'s'}</div>`;$('#radar').appendChild(el)}"
          if old_focus not in s: raise SystemExit('guard failed: focus anchor not found')
          s=s.replace(old_focus,new_focus,1)
          start=s.index("function renderMap(){")
          end=s.index("function toggleLayer",start)
          old=s[start:end]
          new="""function renderMap(){let rad=$('#radar'),svg=$('#routeSvg');rad.classList.remove('focus');rad.querySelectorAll('.pin,.dest,.marketNode,.scanMark,.vnHub').forEach(x=>x.remove());svg.innerHTML='<defs><marker id=\"sellArrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#9fb1bd\"/></marker></defs>';let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[],countryPts={},marketCounts={},marketLive={};function countryPoint(code,seed){let c=String(code||'').toUpperCase();if(c==='VN')return project('VN',0);if(!countryPts[c])countryPts[c]=spreadPoint(project(c,seed),used,seed);return countryPts[c]}rows.forEach((o,i)=>{let e=economics(o),sm=String(e.r?.source_market||e.s?.market||'').toUpperCase(),dm=String(e.r?.destination_market||e.d?.market||o.target_market||'').toUpperCase(),l=tradeLane(o,e),a=countryPoint(sm,i*2+1),b=countryPoint(dm,i*2+2),exec=profitConfirmed(o);if(!a||!b||(!LAYERS.money&&exec)||(!LAYERS.research&&!exec))return;let rid='route-'+String(o.id).replace(/[^a-zA-Z0-9_-]/g,'-'),rp=document.createElementNS('http://www.w3.org/2000/svg','path');rp.setAttribute('id',rid);rp.setAttribute('d',curve(a,b));rp.setAttribute('class','routePath '+(l==='IMPORT_TO_VN'?'import':'export')+' '+(exec?'exec':''));rp.setAttribute('marker-end','url(#sellArrow)');rp.dataset.opp=o.id;rp.dataset.markets=(sm+' '+dm).trim();svg.appendChild(rp);let cargo=document.createElementNS('http://www.w3.org/2000/svg','text');cargo.setAttribute('class','cargo');cargo.dataset.opp=o.id;cargo.dataset.markets=(sm+' '+dm).trim();cargo.textContent=icon(o.title);let motion=document.createElementNS('http://www.w3.org/2000/svg','animateMotion');motion.setAttribute('dur',(2.7+(i%5)*.35)+'s');motion.setAttribute('repeatCount','indefinite');motion.setAttribute('calcMode','linear');let mp=document.createElementNS('http://www.w3.org/2000/svg','mpath');mp.setAttribute('href','#'+rid);motion.appendChild(mp);cargo.appendChild(motion);svg.appendChild(cargo);let live=routeFreshActive(e);[sm,dm].forEach(c=>{if(c&&c!=='VN'){marketCounts[c]=(marketCounts[c]||0)+1;marketLive[c]=marketLive[c]||live}})});Object.keys(countryPts).forEach(c=>{if(c!=='VN'&&countryPts[c])addMarketNode(c,countryPts[c],marketCounts[c]||0,!!marketLive[c])});let hp=project('VN',0);if(hp){let hub=document.createElement('div');hub.className='vnHub';hub.style.left=hp.x+'%';hub.style.top=hp.y+'%';hub.innerHTML='<div class=\"vnHubCore\">🇻🇳</div><div class=\"vnHubLabel\">VIETNAM HUB</div>';rad.appendChild(hub)}if(LAYERS.scan){let obs=A(DATA,'observations').filter(x=>GEO[x.source_country]&&String(x.source_country).toUpperCase()!=='VN').sort((a,b)=>String(b.observed_at||'').localeCompare(String(a.observed_at||'')));obs.slice(0,45).forEach((x,i)=>{let pt=project(x.source_country,i);if(!pt)return;let el=document.createElement('div'),fresh=Date.now()-new Date(x.observed_at||0).getTime()<2*60*1000;el.className='scanMark'+(fresh?' live':'');el.style.left=pt.x+'%';el.style.top=pt.y+'%';el.innerHTML=fresh?`<div class=\"scanLive\"></div><div class=\"scanTag\">LIVE · ${E(x.source_country)}</div>`:'<div class=\"scanDone\"></div>';rad.appendChild(el)})}}"""
          if "addMotionSource" not in old or "spreadPoint(project(sm" not in old: raise SystemExit('guard failed: renderMap shape changed')
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
          node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('index.html','utf8'); const m=s.match(/<script>([\s\S]*?)<\/script>/); if(!m) throw Error('script missing'); new Function(m[1]); console.log('JS syntax OK');
          NODE
          grep -q "marketCounts" index.html
          grep -q "VIETNAM HUB" index.html
      - name: Commit patch
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git commit -m 'Collapse map to one node per country'
          git push
