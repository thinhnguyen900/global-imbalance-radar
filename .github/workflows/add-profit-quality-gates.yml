name: Add profit quality gates
on:
  push:
    paths:
      - '.github/workflows/add-profit-quality-gates.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard and patch dashboard
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert "function profitQuality(o)" in s
          assert "function profitQualityStageHtml(o)" not in s
          anchor="function profitConfirmed(o){"
          helper="""function profitQualityStageHtml(o){let q=profitQuality(o),a=[['SOURCE',q.sourceAccessible],['BENCH',q.benchmarkStrong],['FREIGHT',q.freightStrong],['TAX',q.taxStrong],['SELL',q.commercialStrong],['CONF',q.confidenceStrong]];return a.map(([n,ok])=>`<span class=\"stage ${ok?'done':'miss'}\">${ok?'✓':'·'} ${n}</span>`).join('')}function profitQualityCount(o){let q=profitQuality(o);return[q.sourceAccessible,q.benchmarkStrong,q.freightStrong,q.taxStrong,q.commercialStrong,q.confidenceStrong].filter(Boolean).length}"""
          assert anchor in s
          s=s.replace(anchor,helper+anchor,1)
          old="<td><div class=\"queueStatus\">${stageHtml(o,e)}</div></td><td>${researchAgeHtml(o)}</td>"
          new="<td><div class=\"queueStatus\">${stageHtml(o,e)}</div><div class=\"mini\" style=\"margin-top:5px\"><b>P-CERT ${profitQualityCount(o)}/6</b> · ${E(conciseStatus(o,e)[0])}</div></td><td>${researchAgeHtml(o)}</td>"
          assert old in s
          s=s.replace(old,new,1)
          old2="<div class=\"detailSection\"><h3>Current route</h3>"
          new2="<div class=\"detailSection\"><h3>Profit-confirmation quality</h3><div class=\"queueStatus\">${profitQualityStageHtml(o)}</div><div class=\"mini\" style=\"margin-top:8px\">${profitQualityCount(o)}/6 quality gates passed · ${E(conciseStatus(o,e)[0])}</div></div><div class=\"detailSection\"><h3>Current route</h3>"
          assert old2 in s
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Syntax and invariant checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('function profitQualityStageHtml(o)') == 1
          assert 'P-CERT ${profitQualityCount(o)}/6' in s
          assert 'Profit-confirmation quality' in s
          assert 'function renderMap()' in s and 'VIETNAM HUB' in s
          print('guards ok')
          PY
          node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('index.html','utf8'); const js=s.match(/<script>([\s\S]*)<\/script>/)[1]; new Function(js); console.log('js syntax ok');
          NODE
      - name: Commit patch
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Expose profit confirmation quality gates'
          git push