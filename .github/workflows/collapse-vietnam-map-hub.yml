name: Collapse Vietnam map hub
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collapse-vietnam-map-hub.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guarded patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="a=spreadPoint(project(sm,i),used,i*2+1),b=spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          new="a=String(sm).toUpperCase()==='VN'?project('VN',0):spreadPoint(project(sm,i),used,i*2+1),b=String(dm).toUpperCase()==='VN'?project('VN',0):spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          if old not in s:
              raise SystemExit('route-point guard not found')
          s=s.replace(old,new,1)
          old2="addMotionSource(sm,a,o,i,live);addMotionDest(dm,b,o,i,live)"
          new2="if(String(sm).toUpperCase()!=='VN')addMotionSource(sm,a,o,i,live);if(String(dm).toUpperCase()!=='VN')addMotionDest(dm,b,o,i,live)"
          if old2 not in s:
              raise SystemExit('endpoint-node guard not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Validate invariants
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "project('VN',0)" in s
          assert "String(sm).toUpperCase()!=='VN'" in s
          assert "String(dm).toUpperCase()!=='VN'" in s
          assert 'vnHubCore' in s and 'VIETNAM HUB' in s
          assert 'renderMap()' in s and 'animateMotion' in s and 'focusOppMap' in s
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git commit -m "Collapse Vietnam route endpoints into single map hub"
          git push
