name: Tighten freight status semantics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collapse-vietnam-map-hub.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guarded patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function statusKind(s){s=String(s||'').toLowerCase();if(/blocked|failed|reject|exhaust/.test(s))return'blocked';if(/check|progress|search|pending|incomplete/.test(s))return'checking';if(/verified|complete|quoted|known|public_tariff_only|indicative_only/.test(s))return'done';return'missing'}"
          new="function statusKind(s){s=String(s||'').toLowerCase();if(/blocked|failed|reject|exhaust/.test(s))return'blocked';if(/public_tariff_only|indicative_only|estimate|check|progress|search|pending|incomplete/.test(s))return'checking';if(/verified|complete|quoted|known/.test(s))return'done';return'missing'}"
          if old not in s:
              raise SystemExit('statusKind guard not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Validate invariants
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "public_tariff_only|indicative_only|estimate|check" in s
          assert "if(/verified|complete|quoted|known/.test(s))return'done'" in s
          assert 'profitQuality' in s and 'profitConfirmed' in s
          assert 'renderMap()' in s and 'vnHubCore' in s and 'marketNode' in s
          assert 'animateMotion' in s and 'focusMarketMap' in s
      - name: Syntax check inline JS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script block missing')
          Path('/tmp/radar.js').write_text(m.group(1))
          PY
          node --check /tmp/radar.js
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git commit -m "Treat indicative freight as unresolved research"
          git push
