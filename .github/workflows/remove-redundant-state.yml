name: Remove redundant research state
on:
  push:
    paths:
      - '.github/workflows/remove-redundant-state.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove duplicated state column only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          header='<th>Price comparison</th><th>State</th><th>Priority</th>'
          state='<td class="stateCol"><span class="statusTag ${st[1]}">${st[0]}</span></td>'
          if s.count(header)!=1:
              raise SystemExit(f'expected exactly 1 research State header, found {s.count(header)}')
          if s.count(state)!=1:
              raise SystemExit(f'expected exactly 1 research State cell, found {s.count(state)}')
          s=s.replace(header,'<th>Price comparison</th><th>Priority</th>',1)
          s=s.replace(state,'',1)
          p.write_text(s)
          PY
      - name: Verify no unrelated UI regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['Price comparison','animateMotion','routeSourcePulse','routeDestPulse','Focus Results','Hunt / Quote','activeGatePulse','Rejected / checked history']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing preserved invariants: '+', '.join(missing))
          if '<th>Price comparison</th><th>State</th><th>Priority</th>' in s:
              raise SystemExit('redundant State header still present')
          if '<td class="stateCol">' in s:
              raise SystemExit('redundant State cell still present')
          print('UI invariants preserved; redundant state removed')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script not found')
          Path('/tmp/radar.js').write_text(m.group(1))
          PY
          node --check /tmp/radar.js
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/remove-redundant-state.yml
          git config user.name 'Radar UI Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/remove-redundant-state.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Remove redundant research state column'
          git push
