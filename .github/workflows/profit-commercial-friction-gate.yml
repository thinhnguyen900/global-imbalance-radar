name: Profit Commercial Friction Gate
on:
  push:
    paths:
      - '.github/workflows/profit-commercial-friction-gate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add commercial friction evidence gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old1="benchmarkStrong=benchmark>=80,confidenceStrong=N(o.confidence,0)>=90;return{sourceAccessible,freightStrong,taxStrong,benchmarkStrong,confidenceStrong,benchmark}}"
          new1="benchmarkStrong=benchmark>=80,confidenceStrong=N(o.confidence,0)>=90,commercialText=JSON.stringify([meta(r),o.estimates||{},o.hypotheses||{}]).toLowerCase(),commercialStrong=/(sales_channel|sell_right|marketplace|channel_economics|ebay|shopify|tiktok|dealer)/.test(commercialText)&&/(fee|commission|payment|processing)/.test(commercialText)&&/(return|warranty|defect|loss|haircut|risk)/.test(commercialText);return{sourceAccessible,freightStrong,taxStrong,benchmarkStrong,confidenceStrong,commercialStrong,benchmark}}"
          old2="&&q.benchmarkStrong&&q.confidenceStrong}function laneText"
          new2="&&q.benchmarkStrong&&q.confidenceStrong&&q.commercialStrong}function laneText"
          old3="if(!q.confidenceStrong)return[`CONFIDENCE ${N(o.confidence,0)}/90`,'check'];return['READY FOR PROMOTION','ok']}"
          new3="if(!q.confidenceStrong)return[`CONFIDENCE ${N(o.confidence,0)}/90`,'check'];if(!q.commercialStrong)return['SELLING FRICTIONS PENDING','check'];return['READY FOR PROMOTION','ok']}"
          for label,old in [('profitQuality',old1),('profitConfirmed',old2),('conciseStatus',old3)]:
              if s.count(old)!=1:
                  raise SystemExit(f'{label} guard count={s.count(old)}')
          s=s.replace(old1,new1).replace(old2,new2).replace(old3,new3)
          p.write_text(s)
          PY
      - name: Validate patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'commercialStrong' in s
          assert 'SELLING FRICTIONS PENDING' in s
          assert '&&q.commercialStrong}function laneText' in s
          print('commercial friction gate guards passed')
          PY
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script>([\s\S]*)<\/script>/);if(!m)throw Error('script not found');new Function(m[1]);console.log('JS syntax OK')"
      - name: Commit bounded dashboard logic change
        run: |
          git config user.name 'radar-builder'
          git config user.email 'radar-builder@users.noreply.github.com'
          git add index.html
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Require selling friction evidence for profit confirmation'
          git push
