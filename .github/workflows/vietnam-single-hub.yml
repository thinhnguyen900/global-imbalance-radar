name: Vietnam single hub
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch map
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[];rows.forEach((o,i)=>{let e=economics(o),sm=e.r?.source_market||e.s?.market,dm=e.r?.destination_market||e.d?.market||o.target_market,l=tradeLane(o,e),a=spreadPoint(project(sm,i),used,i*2+1),b=spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          new="let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[],vnPoint=project('VN',0);rows.forEach((o,i)=>{let e=economics(o),sm=e.r?.source_market||e.s?.market,dm=e.r?.destination_market||e.d?.market||o.target_market,l=tradeLane(o,e),a=String(sm).toUpperCase()==='VN'?vnPoint:spreadPoint(project(sm,i),used,i*2+1),b=String(dm).toUpperCase()==='VN'?vnPoint:spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          assert s.count(old)==1
          s=s.replace(old,new)
          old2="let live=routeFreshActive(e);addMotionSource(sm,a,o,i,live);addMotionDest(dm,b,o,i,live)});let hp=project('VN',0);"
          new2="let live=routeFreshActive(e);if(String(sm).toUpperCase()!=='VN')addMotionSource(sm,a,o,i,live);if(String(dm).toUpperCase()!=='VN')addMotionDest(dm,b,o,i,live)});let hp=vnPoint;"
          assert s.count(old2)==1
          p.write_text(s.replace(old2,new2))
          PY
      - name: Check JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/radar.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])
          PY
          node --check /tmp/radar.js
      - name: Commit
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git commit -m "Collapse Vietnam map routes into one hub"
          git push