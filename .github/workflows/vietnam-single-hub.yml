name: Vietnam single hub
on:
  push:
    paths:
      - '.github/workflows/vietnam-single-hub.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map to one Vietnam hub
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="a=spreadPoint(project(sm,i),used,i*2+1),b=spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          new="a=String(sm||'').toUpperCase()==='VN'?project('VN',0):spreadPoint(project(sm,i),used,i*2+1),b=String(dm||'').toUpperCase()==='VN'?project('VN',0):spreadPoint(project(dm,i+4),used,i*2+2),exec=profitConfirmed(o);"
          if old not in s:
              raise SystemExit('guard failed: route coordinate expression changed')
          s=s.replace(old,new,1)
          old2="let live=routeFreshActive(e);addMotionSource(sm,a,o,i,live);addMotionDest(dm,b,o,i,live)"
          new2="let live=routeFreshActive(e);if(String(sm||'').toUpperCase()!=='VN')addMotionSource(sm,a,o,i,live);if(String(dm||'').toUpperCase()!=='VN')addMotionDest(dm,b,o,i,live)"
          if old2 not in s:
              raise SystemExit('guard failed: node render expression changed')
          s=s.replace(old2,new2,1)
          old3="A(DATA,'observations').filter(x=>GEO[x.source_country]).sort"
          new3="A(DATA,'observations').filter(x=>GEO[x.source_country]&&String(x.source_country).toUpperCase()!=='VN').sort"
          if old3 not in s:
              raise SystemExit('guard failed: scan filter changed')
          s=s.replace(old3,new3,1)
          p.write_text(s)
      - name: Verify single-hub invariants
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text()
          assert "toUpperCase()==='VN'?project('VN',0)" in s
          assert "toUpperCase()!=='VN')addMotionSource" in s
          assert "toUpperCase()!=='VN')addMotionDest" in s
          assert "source_country).toUpperCase()!=='VN'" in s
          script=re.search(r'<script>(.*)</script>',s,re.S).group(1)
          f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False)
          f.write(script); f.close()
          subprocess.run(['node','--check',f.name],check=True)
      - name: Commit patch
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Render one shared Vietnam hub on trade map"
          git push
