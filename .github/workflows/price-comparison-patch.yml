name: Smart price comparison patch
on:
  push:
    paths:
      - '.github/workflows/price-comparison-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch comparison hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('index.html')
          s=p.read_text()
          css=base64.b64decode('').decode()
          js=base64.b64decode('').decode()
          css_pat=r'\.benchmarkCell\{white-space:nowrap\}.*?\.research \.tbl td\{vertical-align:middle\}'
          s2,n=re.subn(css_pat,css,s,count=1)
          if n != 1:
              raise SystemExit(f'CSS patch expected 1 match, got {n}')
          s=s2
          js_pat=r'function marketBenchmarkFor\(o,e\)\{.*?\}function benchmarkCellHtml\(o,e\)\{.*?\}function renderResearch\(\)\{.*?\}(?=function renderArchive\(\))'
          s2,n=re.subn(js_pat,js,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'JS patch expected 1 match, got {n}')
          p.write_text(s2)
          PY
      - name: Verify preserved behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<th>Price comparison</th>' index.html
          grep -q 'function comparisonCellHtml' index.html
          grep -q 'HEADROOM +US' index.html
          grep -q 'OVER COST US' index.html
          grep -q 'market_price_benchmarks' index.html
          ! grep -q '<th>Competitive benchmark</th>' index.html
          ! grep -q '<th>Landed / margin</th><th>State' index.html
          grep -q 'animateMotion' index.html
          grep -q 'sellArrow' index.html
          grep -q 'activeGatePulse' index.html
          grep -q 'Focus Results' index.html
          grep -q 'Hunt / Quote' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script block missing')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
          curl -fsS 'https://pixiaznazjmofxufgpru.supabase.co/functions/v1/radar-control-center?action=data' > /tmp/data.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/data.json'))
          required=['opportunities','route_attempts','observations','evidence','active_focus','market_price_benchmarks','market_price_benchmark_samples']
          missing=[k for k in required if k not in d]
          if missing: raise SystemExit('dashboard contract missing: '+','.join(missing))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Radar UI Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Compare competitive market directly with landed cost'
          git push
