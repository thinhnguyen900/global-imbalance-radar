name: Prioritize profit quality
on:
  push:
    paths:
      - '.github/workflows/prioritize-profit-quality.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Vietnam candidate prioritization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements=[
            ("rows=ops.filter(o=>tradeLane(o)===lane).sort((a,b)=>(profitConfirmed(b)-profitConfirmed(a))||(economics(b).done-economics(a).done)||N(score(b),-1)-N(score(a),-1))",
             "rows=ops.filter(o=>tradeLane(o)===lane).sort((a,b)=>(profitConfirmed(b)-profitConfirmed(a))||(profitQualityCount(b)-profitQualityCount(a))||(economics(b).done-economics(a).done)||N(score(b),-1)-N(score(a),-1))"),
            ("pick=lane=>ops.filter(o=>tradeLane(o)===lane).sort((a,b)=>(profitConfirmed(b)-profitConfirmed(a))||(economics(b).done-economics(a).done)||N(score(b),-1)-N(score(a),-1))[0]",
             "pick=lane=>ops.filter(o=>tradeLane(o)===lane).sort((a,b)=>(profitConfirmed(b)-profitConfirmed(a))||(profitQualityCount(b)-profitQualityCount(a))||(economics(b).done-economics(a).done)||N(score(b),-1)-N(score(a),-1))[0]"),
            ("((researchAgeHours(b)>=24?1:0)-(researchAgeHours(a)>=24?1:0))||economics(b).done-economics(a).done||N(score(b),-1)-N(score(a),-1)",
             "((researchAgeHours(b)>=24?1:0)-(researchAgeHours(a)>=24?1:0))||(profitQualityCount(b)-profitQualityCount(a))||economics(b).done-economics(a).done||N(score(b),-1)-N(score(a),-1)"),
            ("${e.done}/6 gates · ${E(st[0])} · confidence ${best.confidence==null?'—':N(best.confidence)+'%'}",
             "P-CERT ${profitQualityCount(best)}/6 · execution ${e.done}/6 · ${E(st[0])} · confidence ${best.confidence==null?'—':N(best.confidence)+'%'}"),
            ("let desc=o=>o?`${economics(o).done}/6 gates · ${E(conciseStatus(o,economics(o))[0])}`:'No active candidate yet'",
             "let desc=o=>o?`P-CERT ${profitQualityCount(o)}/6 · execution ${economics(o).done}/6 · ${E(conciseStatus(o,economics(o))[0])}`:'No active candidate yet'")
          ]
          for old,new in replacements:
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'guard failed: expected 1 occurrence, got {n}: {old[:80]}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script not found')
          Path('/tmp/radar.js').write_text(m.group(1))
          PY
          node --check /tmp/radar.js
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git commit -m "Prioritize profit-certainty quality in Vietnam research" || exit 0
          git push
          git rm .github/workflows/prioritize-profit-quality.yml
          git commit -m "Remove temporary profit-quality patch workflow"
          git push
