name: Single Vietnam map hub
on:
  push:
    paths:
      - '.github/workflows/fix-vn-hub-single-node.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Vietnam hub rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old1="a=spreadPoint(project(sm,i),used,i*2+1),b=spreadPoint(project(dm,i+4),used,i*2+2)"
          new1="a=String(sm||'').toUpperCase()==='VN'?project('VN',0):spreadPoint(project(sm,i),used,i*2+1),b=String(dm||'').toUpperCase()==='VN'?project('VN',0):spreadPoint(project(dm,i+4),used,i*2+2)"
          old2="let live=routeFreshActive(e);addMotionSource(sm,a,o,i,live);addMotionDest(dm,b,o,i,live)"
          new2="let live=routeFreshActive(e);if(String(sm||'').toUpperCase()!=='VN')addMotionSource(sm,a,o,i,live);if(String(dm||'').toUpperCase()!=='VN')addMotionDest(dm,b,o,i,live)"
          assert old1 in s, 'route endpoint placement target missing'
          assert old2 in s, 'route endpoint node target missing'
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Syntax check dashboard script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m, 'script block missing'
          Path('/tmp/radar-script.js').write_text(m.group(1))
          PY
          node --check /tmp/radar-script.js
      - name: Commit patch
        run: |
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Render Vietnam as one map hub"
          git push