name: Vietnam hub regional split
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vn-hub-region-split.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map hub logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function project(c,i=0){let p=GEO[c];if(!p)return null;return{x:(p[0]+180)/360*100+((i%3)-1)*.7,y:(90-p[1])/180*100}}function curve"
          new="function project(c,i=0){let p=GEO[c];if(!p)return null;return{x:(p[0]+180)/360*100+((i%3)-1)*.7,y:(90-p[1])/180*100}}function vnRegion(o,e,side){let r=e?.r,m=meta(r),raw=String(m.vn_region||m.vietnam_region||m[side+'_region']||m[side+'_vn_region']||'').toUpperCase();if(/NORTH|BAC|HANOI|HA NOI|HP|HAIPHONG/.test(raw))return'NORTH';if(/CENTRAL|MIDDLE|MIEN TRUNG|DANANG|DA NANG|QUANG/.test(raw))return'CENTRAL';if(/SOUTH|NAM|HCM|SAIGON|HO CHI MINH|BINH DUONG|DONG NAI/.test(raw))return'SOUTH';return''}function vnRegionalPoint(region){let base=project('VN',0);if(!base)return null;if(region==='NORTH')return{x:base.x+.5,y:base.y-5};if(region==='CENTRAL')return{x:base.x-.2,y:base.y};if(region==='SOUTH')return{x:base.x-.6,y:base.y+5};return base}function curve"
          if s.count(old)!=1: raise SystemExit(f'project guard failed: {s.count(old)}')
          s=s.replace(old,new)
          old2="let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[],countryPts={},marketCounts={},marketLive={},visibleImportRoutes=0,visibleExportRoutes=0;function countryPoint(code,seed){let c=String(code||'').toUpperCase();if(c==='VN')return project('VN',0);if(!countryPts[c])countryPts[c]=spreadPoint(project(c,seed),used,seed);return countryPts[c]}rows.forEach((o,i)=>{let e=economics(o),sm=String(e.r?.source_market||e.s?.market||'').toUpperCase(),dm=String(e.r?.destination_market||e.d?.market||o.target_market||'').toUpperCase(),l=tradeLane(o,e),a=countryPoint(sm,i*2+1),b=countryPoint(dm,i*2+2),exec=profitConfirmed(o);"
          new2="let rows=A(DATA,'opportunities').filter(vnActive).slice(0,18),used=[],countryPts={},marketCounts={},marketLive={},visibleImportRoutes=0,visibleExportRoutes=0,regions=[...new Set(A(DATA,'opportunities').filter(vnActive).flatMap(o=>{let e=economics(o),r=[];if(String(e.r?.source_market||e.s?.market||'').toUpperCase()==='VN')r.push(vnRegion(o,e,'source'));if(String(e.r?.destination_market||e.d?.market||o.target_market||'').toUpperCase()==='VN')r.push(vnRegion(o,e,'destination'));return r.filter(Boolean)}))],splitVN=regions.length>=2;function countryPoint(code,seed){let c=String(code||'').toUpperCase();if(c==='VN')return project('VN',0);if(!countryPts[c])countryPts[c]=spreadPoint(project(c,seed),used,seed);return countryPts[c]}rows.forEach((o,i)=>{let e=economics(o),sm=String(e.r?.source_market||e.s?.market||'').toUpperCase(),dm=String(e.r?.destination_market||e.d?.market||o.target_market||'').toUpperCase(),l=tradeLane(o,e),a=sm==='VN'&&splitVN?vnRegionalPoint(vnRegion(o,e,'source')):countryPoint(sm,i*2+1),b=dm==='VN'&&splitVN?vnRegionalPoint(vnRegion(o,e,'destination')):countryPoint(dm,i*2+2),exec=profitConfirmed(o);"
          if s.count(old2)!=1: raise SystemExit(f'render route guard failed: {s.count(old2)}')
          s=s.replace(old2,new2)
          old3="let hp=project('VN',0);if(hp){let hub=document.createElement('div');hub.className='vnHub';hub.style.left=hp.x+'%';hub.style.top=hp.y+'%';hub.innerHTML=`<div class=\"vnHubCore\">🇻🇳</div><div class=\"vnHubLabel\">VIETNAM HUB · ${visibleImportRoutes} IN · ${visibleExportRoutes} OUT</div>`;rad.appendChild(hub)}if(LAYERS.scan)"
          new3="if(splitVN){['NORTH','CENTRAL','SOUTH'].forEach(region=>{let hp=vnRegionalPoint(region),hub=document.createElement('div');hub.className='vnHub';hub.style.left=hp.x+'%';hub.style.top=hp.y+'%';hub.innerHTML=`<div class=\"vnHubCore\">🇻🇳</div><div class=\"vnHubLabel\">${region==='CENTRAL'?'CENTRAL VN':region+' VN'}</div>`;rad.appendChild(hub)})}else{let hp=project('VN',0);if(hp){let hub=document.createElement('div');hub.className='vnHub';hub.style.left=hp.x+'%';hub.style.top=hp.y+'%';hub.innerHTML=`<div class=\"vnHubCore\">🇻🇳</div><div class=\"vnHubLabel\">VIETNAM HUB · ${visibleImportRoutes} IN · ${visibleExportRoutes} OUT</div>`;rad.appendChild(hub)}}if(LAYERS.scan)"
          if s.count(old3)!=1: raise SystemExit(f'hub guard failed: {s.count(old3)}')
          s=s.replace(old3,new3)
          p.write_text(s)
          PY
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const js=s.match(/<script>([\s\S]*)<\/script>/)[1];new Function(js);console.log('JS syntax OK')"
          rm .github/workflows/vn-hub-region-split.yml
          git config user.name radar-builder
          git config user.email radar-builder@users.noreply.github.com
          git add index.html .github/workflows/vn-hub-region-split.yml
          git commit -m "Keep one Vietnam hub unless regional data justifies split"
          git push