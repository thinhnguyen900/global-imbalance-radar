<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Intent Intake V0</title><style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#e8f0f7;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1100px;margin:auto;padding:18px}.panel{background:#0c1720;border:1px solid #203241;border-radius:12px;padding:16px;margin-bottom:12px}h1{margin:0 0 6px}.muted{color:#8295a7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;color:#9fb0bd;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #304555;border-radius:8px;background:#09151e;color:#fff}textarea{min-height:80px}.btn{padding:10px 14px;border:1px solid #3b6d5e;border-radius:8px;background:#11332a;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.status{padding:10px;border:1px solid #304555;border-radius:8px;margin-top:10px}.good{border-color:#28604f;color:#70e0ae}.bad{border-color:#69402f;color:#ff9f9f}.req{padding:12px;border-bottom:1px solid #1b2b37}.pill{display:inline-block;padding:3px 7px;border:1px solid #385264;border-radius:999px;font-size:10px;margin-right:5px}.warn{color:#f5c56d}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><section class="panel"><h1>🎯 Customer Intent Intake V0</h1><div class="muted">Hunt / Quote / Restock / Price-drop / Early-access. Requests create research-priority demand signals, but are not treated as verified sales.</div></section><section class="panel"><form id="f"><div class="grid"><div><label>Request type</label><select name="request_type" required><option>HUNT</option><option>QUOTE</option><option>RESTOCK</option><option>PRICE_DROP</option><option>EARLY_ACCESS</option></select></div><div><label>Destination market (ISO-2)</label><input name="destination_market" value="VN" maxlength="2" required></div><div class="full"><label>Product / SKU / description</label><input name="product_query" placeholder="e.g. Sony WH-1000XM6 black"></div><div class="full"><label>Product URL (optional)</label><input name="product_url" type="url" placeholder="https://..."></div><div><label>Max landed price (optional)</label><input name="max_landed_price" type="number" min="0" step="0.01" placeholder="9000000"></div><div><label>Currency</label><input name="currency" value="VND" maxlength="3"></div><div><label>Deadline (optional)</label><input name="deadline" type="datetime-local"></div><div><label>Commitment level</label><select name="commitment_level"><option value="INTEREST">Just interested</option><option value="WANTS_QUOTE">Want a real quote</option><option value="READY_IF_CONDITIONS_MET">Ready to buy if conditions are met</option></select></div><div><label>Condition preference</label><input name="condition_preference" placeholder="New only / open-box acceptable"></div><div><label>Warranty preference</label><input name="warranty_preference" placeholder="Official warranty preferred"></div><div class="full"><button id="submit" class="btn">Submit request</button><div id="result"></div></div></div></form></section><section class="panel"><h2>My submitted requests</h2><div class="muted">Stored only in this browser as request IDs; the public API does not list other users' requests.</div><div id="mine"></div></section></main><script>const API='https://pixiaznazjmofxufgpru.supabase.co/functions/v1/customer-intent';const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function ids(){try{return JSON.parse(localStorage.getItem('radar_customer_request_ids')||'[]')}catch{return[]}}function saveId(id){let a=ids();a=[String(id),...a.filter(x=>String(x)!==String(id))].slice(0,20);localStorage.setItem('radar_customer_request_ids',JSON.stringify(a))}function payload(form){let o=Object.fromEntries(new FormData(form).entries());if(!o.product_query)o.product_query=null;if(!o.product_url)o.product_url=null;if(!o.max_landed_price){o.max_landed_price=null;o.currency=null}else o.max_landed_price=Number(o.max_landed_price);if(!o.deadline)o.deadline=null;return o}async function refresh(){let box=document.querySelector('#mine'),a=ids();if(!a.length){box.innerHTML='<div class="status muted">No request submitted from this browser yet.</div>';return}let out=[];for(const id of a){try{let r=await fetch(API+'?id='+encodeURIComponent(id),{cache:'no-store'});let j=await r.json();if(j.ok)out.push(j.request)}catch{}}box.innerHTML=out.length?out.map(x=>`<div class="req"><b>#${E(x.id)} · ${E(x.product_query||x.product_url||'Request')}</b><div style="margin-top:6px"><span class="pill">${E(x.request_type)}</span><span class="pill">${E(x.destination_market)}</span><span class="pill">${E(x.commitment_level)}</span><span class="pill">priority ${E(x.research_priority)}</span><span class="pill">${E(x.status)}</span></div><div class="muted" style="margin-top:6px">Demand proof: ${E(x.demand_proof_level)}${x.max_landed_price!=null?' · ceiling '+Number(x.max_landed_price).toLocaleString()+' '+E(x.currency):''}</div></div>`).join(''):'<div class="status muted">No accessible request found.</div>'}document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();let b=document.querySelector('#submit'),res=document.querySelector('#result');b.disabled=true;res.innerHTML='<div class="status warn">Submitting…</div>';try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload(e.target))});let j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'submit failed');saveId(j.request.id);res.innerHTML=`<div class="status good"><b>Queued #${E(j.request.id)}</b> · priority ${E(j.request.research_priority)} · demand proof ${E(j.request.demand_proof_level)}. The engine can now research sourcing, freight, tax/compliance and landed economics.</div>`;refresh()}catch(err){res.innerHTML=`<div class="status bad">${E(err.message)}</div>`}finally{b.disabled=false}});refresh();setInterval(refresh,10000);</script></body></html>
